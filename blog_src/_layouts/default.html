<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/styles_sync/style.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/styles_sync/font.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/styles/blog.css' | relative_url }}">
  
  <!-- MathJax for math rendering -->
  <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true,
        processEnvironments: true
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
      }
    };
  </script>
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  
  <!-- Highlight.js for code syntax highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/bash.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Configure highlight.js to respect language classes and handle nohighlight
      hljs.configure({
        classPrefix: 'hljs-',
        languages: ['python', 'javascript', 'bash', 'text']
      });
      
      // Highlight all code blocks, respecting language classes
      document.querySelectorAll('pre code').forEach((block) => {
        // Skip blocks with nohighlight class
        if (block.classList.contains('nohighlight')) {
          return;
        }
        
        // Let highlight.js auto-detect or use specified language
        hljs.highlightElement(block);
      });
    });
  </script>
</head>
<body>
  <div id="header-placeholder"></div>
  <script src="{{ '/assets/scripts_sync/header.js' | relative_url }}"></script>

  <main>
    {{ content }}
  </main>
</body>
</html>
